name: daenew-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      ref:
        description: Git ref to build from
        required: false
        default: daenew
        type: string
      make_latest:
        description: Mark the published release as latest
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daenew-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-manual:
    secrets: inherit
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
      ref: ${{ inputs.ref }}
      update_tag: false
      make_latest: ${{ inputs.make_latest }}
