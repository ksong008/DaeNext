name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  ci:
    name: workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native eBPF toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          cargo install bpf-linker --version 0.10.3 --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev pkg-config

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Release gate
        env:
          DAENEXT_RELEASE_GATE_AUDIT: "1"
        run: scripts/release_gate.sh

      - name: Build dae
        run: |
          DAE_VERSION="dae rust-native ci ${GITHUB_SHA::12}" \
            cargo build --release -p dae-cli --bin dae
          ./target/release/dae export outline >/tmp/dae-config-outline.json
