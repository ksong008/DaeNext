name: daecore

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - personal/**
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".gitmodules"
      - ".github/workflows/daecore.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".gitmodules"
      - ".github/workflows/daecore.yml"

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.3"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-15 llvm-15

      - name: Download Go modules
        run: go mod download

      - name: Prepare location assets
        run: |
          mkdir -p .github/dae-assets
          curl -L -o .github/dae-assets/geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          curl -L -o .github/dae-assets/geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat

      - name: Generate eBPF artifacts
        env:
          CLANG: clang-15
          STRIP: llvm-strip-15
        run: make ebpf

      - name: Run unit tests
        env:
          DAE_LOCATION_ASSET: ${{ github.workspace }}/.github/dae-assets
        run: |
          packages=$(go list ./... | grep -v '^github.com/daeuniverse/dae/control/kern/tests$')
          failed=""
          for pkg in $packages; do
            echo "::group::go test $pkg"
            output_file=$(mktemp)
            if ! (set -o pipefail; go test -count=1 -v "$pkg" 2>&1 | tee "$output_file"); then
              failed_tests=$(grep '^--- FAIL:' "$output_file" | sed -E 's/^--- FAIL: ([^ ]+).*/\1/' | tr '\n' ' ' | sed 's/[[:space:]]\\+$//')
              echo "::error title=go test failed::$pkg"
              if [ -n "$failed_tests" ]; then
                echo "::error title=go test cases failed::$pkg :: $failed_tests"
              fi
              failed="$failed $pkg"
            fi
            rm -f "$output_file"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed packages:$failed"
            {
              echo "## Failed packages"
              for pkg in $failed; do
                echo "- \`$pkg\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.3"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-15 llvm-15

      - name: Download Go modules
        run: go mod download

      - name: Prepare location assets
        run: |
          mkdir -p .github/dae-assets
          curl -L -o .github/dae-assets/geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          curl -L -o .github/dae-assets/geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat

      - name: Generate eBPF artifacts
        env:
          CLANG: clang-15
          STRIP: llvm-strip-15
        run: make ebpf

      - name: Build dae core
        env:
          DAE_LOCATION_ASSET: ${{ github.workspace }}/.github/dae-assets
        run: |
          tags="$(cat .build_tags 2>/dev/null || true)"
          if [ -n "$tags" ]; then
            go build -tags="$tags" ./...
          else
            go build ./...
          fi
