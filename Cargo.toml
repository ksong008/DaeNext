[workspace]
members = [
    "crates/dae-cli",
    "crates/dae-config",
    "crates/dae-config-util",
    "crates/dae-daemon",
    "crates/dae-product-identity",
    "crates/dae-product-core",
    "crates/dae-product-control",
    "crates/dae-product-http",
    "crates/dae-product-persistence",
    "crates/dae-product-runtime",
    "crates/dae-product-subscription",
    "crates/dae-product-geodata",
    "crates/dae-runtime-control",
    "crates/dae-core-types",
    "crates/dae-bench",
    "crates/dae-build-support",
    "crates/dae-ebpf-loader",
    "crates/dae-ebpf-abi",
    "crates/dae-datapath",
    "crates/dae-dns",
    "crates/dae-ebpf-program",
    "crates/dae-ebpf-support",
    "crates/dae-geodata",
    "crates/dae-golden",
    "crates/dae-netutil",
    "crates/dae-outbound",
    "crates/dae-outbound-core",
    "crates/dae-outbound-quic",
    "crates/dae-outbound-stream",
    "crates/dae-resident-core",
    "crates/dae-resident-dns",
    "crates/dae-resident-dataplane",
    "crates/dae-resident-model",
    "crates/dae-resident-plan",
    "crates/dae-resident-runtime",
    "crates/dae-resident-tcp",
    "crates/dae-resident-transport",
    "crates/dae-resident-udp",
    "crates/dae-routing",
    "crates/dae-sysdump",
    "crates/dae-sniffing",
    "crates/dae-tls",
    "crates/dae-trace",
]
exclude = [
    "vendor/boring-v4-compat",
    "vendor/boring-sys-v4-compat",
    "vendor/quinn-boring",
]
resolver = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.production-performance]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = false

[profile.production-size]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
panic = "unwind"
strip = true

[patch.crates-io]
boring-sys = { path = "vendor/boring-sys" }
boring-sys-v4-compat = { package = "boring-sys", path = "vendor/boring-sys-v4-compat" }
boring-v4-compat = { package = "boring", path = "vendor/boring-v4-compat" }

[workspace.package]
version = "3.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ksong008/DaeNext"

[workspace.dependencies]
aho-corasick = "1"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = "0.5"
arc-swap = "1.7"
aya = { version = "0.13.1", default-features = false }
aya-ebpf = { version = "0.1.1", default-features = false }
base64 = "0.22"
blake2 = "0.10"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
boring = "5.1"
boring-sys = { version = "5.1", features = ["mlkem"] }
boring-v4-compat = { package = "boring", path = "vendor/boring-v4-compat" }
brotli = "8"
bytes = "1"
chacha20poly1305 = "0.10"
dae-cli = { path = "crates/dae-cli" }
dae-build-support = { path = "crates/dae-build-support" }
dae-config-util = { path = "crates/dae-config-util" }
dae-config = { path = "crates/dae-config" }
dae-daemon = { path = "crates/dae-daemon", default-features = false }
dae-ebpf-loader = { path = "crates/dae-ebpf-loader" }
dae-ebpf-abi = { path = "crates/dae-ebpf-abi" }
dae-runtime-control = { path = "crates/dae-runtime-control" }
dae-core-types = { path = "crates/dae-core-types" }
dae-datapath = { path = "crates/dae-datapath" }
dae-dns = { path = "crates/dae-dns" }
dae-ebpf-support = { path = "crates/dae-ebpf-support" }
dae-geodata = { path = "crates/dae-geodata" }
dae-golden = { path = "crates/dae-golden" }
dae-netutil = { path = "crates/dae-netutil" }
dae-outbound = { path = "crates/dae-outbound" }
dae-outbound-core = { path = "crates/dae-outbound-core" }
dae-outbound-quic = { path = "crates/dae-outbound-quic" }
dae-outbound-stream = { path = "crates/dae-outbound-stream" }
dae-resident-core = { path = "crates/dae-resident-core" }
dae-resident-dns = { path = "crates/dae-resident-dns" }
dae-resident-dataplane = { path = "crates/dae-resident-dataplane", default-features = false }
dae-resident-model = { path = "crates/dae-resident-model" }
dae-resident-plan = { path = "crates/dae-resident-plan" }
dae-resident-runtime = { path = "crates/dae-resident-runtime" }
dae-resident-tcp = { path = "crates/dae-resident-tcp" }
dae-resident-transport = { path = "crates/dae-resident-transport" }
dae-resident-udp = { path = "crates/dae-resident-udp" }
dae-product-identity = { path = "crates/dae-product-identity" }
dae-product-core = { path = "crates/dae-product-core" }
dae-product-control = { path = "crates/dae-product-control" }
dae-product-http = { path = "crates/dae-product-http" }
dae-product-persistence = { path = "crates/dae-product-persistence" }
dae-product-runtime = { path = "crates/dae-product-runtime" }
dae-product-subscription = { path = "crates/dae-product-subscription" }
dae-product-geodata = { path = "crates/dae-product-geodata" }
dae-routing = { path = "crates/dae-routing" }
dae-sniffing = { path = "crates/dae-sniffing" }
dae-sysdump = { path = "crates/dae-sysdump" }
dae-tls = { path = "crates/dae-tls" }
dae-trace = { path = "crates/dae-trace" }
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "0.0.10"
h2 = "0.4.16"
hashbrown = "0.15"
http = "1"
fastrand = "2"
flate2 = "1"
foreign-types = "0.5"
futures-util = "0.3"
getrandom = "0.3"
ghash = { version = "0.5", features = ["zeroize"] }
hkdf = "0.12"
libc = "0.2"
md-5 = "0.10"
object = { version = "0.36.7", default-features = false, features = ["elf", "read_core", "std"] }
percent-encoding = "2.3"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio"] }
quinn-boring = { path = "vendor/quinn-boring", default-features = false, features = ["runtime-tokio"] }
quinn-proto = { version = "0.11.16", default-features = false }
udp = { package = "quinn-udp", version = "0.5", default-features = false, features = ["tracing"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
socket2 = "0.6"
tokio = { version = "1.52.3", default-features = false, features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-boring = "5.0"
tls-parser = "0.12.2"
tikv-jemallocator = { version = "0.7", default-features = false, features = ["background_threads_runtime_support", "stats"] }
tikv-jemalloc-ctl = { version = "0.7", default-features = false, features = ["stats"] }
tikv-jemalloc-sys = { version = "0.7", default-features = false }
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
