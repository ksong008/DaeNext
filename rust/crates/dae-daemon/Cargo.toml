[package]
name = "dae-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Default Rust-native daemon builds use the allocator selected by live RSS A/B.
default = ["allocator-jemalloc"]
native-ebpf = ["dae-aya-bpf-loader/native-ebpf", "dae-ebpf-support/aya-loader"]
allocator-system = []
allocator-mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
allocator-jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[dependencies]
dae-aya-bpf-loader.workspace = true
dae-config.workspace = true
dae-control.workspace = true
dae-core-types.workspace = true
dae-datapath.workspace = true
dae-dns.workspace = true
dae-ebpf-support.workspace = true
dae-engine.workspace = true
dae-geodata.workspace = true
dae-netutil.workspace = true
dae-outbound.workspace = true
dae-product.workspace = true
dae-routing.workspace = true
dae-sniffing.workspace = true
boring.workspace = true
base64.workspace = true
bytes.workspace = true
fastrand.workspace = true
h2.workspace = true
http.workspace = true
libc.workspace = true
libmimalloc-sys = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
quinn.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
rustls.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3.workspace = true
tls-parser.workspace = true
tokio.workspace = true
tokio-boring.workspace = true
tokio-rustls.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
url.workspace = true
webpki-roots.workspace = true
