[workspace]
members = [
    "crates/dae-cli",
    "crates/dae-config",
    "crates/dae-config-util",
    "crates/dae-control",
    "crates/dae-core-types",
    "crates/dae-datapath",
    "crates/dae-dns",
    "crates/dae-ebpf-support",
    "crates/dae-engine",
    "crates/dae-geodata",
    "crates/dae-golden",
    "crates/dae-netutil",
    "crates/dae-outbound",
    "crates/dae-product",
    "crates/dae-routing",
    "crates/dae-sysdump",
    "crates/dae-sniffing",
    "crates/dae-trace",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/daeuniverse/dae"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
dae-cli = { path = "crates/dae-cli" }
dae-config-util = { path = "crates/dae-config-util" }
dae-config = { path = "crates/dae-config" }
dae-control = { path = "crates/dae-control" }
dae-core-types = { path = "crates/dae-core-types" }
dae-datapath = { path = "crates/dae-datapath" }
dae-dns = { path = "crates/dae-dns" }
dae-ebpf-support = { path = "crates/dae-ebpf-support" }
dae-engine = { path = "crates/dae-engine" }
dae-golden = { path = "crates/dae-golden" }
dae-netutil = { path = "crates/dae-netutil" }
dae-outbound = { path = "crates/dae-outbound" }
dae-product = { path = "crates/dae-product" }
dae-routing = { path = "crates/dae-routing" }
dae-sniffing = { path = "crates/dae-sniffing" }
dae-sysdump = { path = "crates/dae-sysdump" }
dae-trace = { path = "crates/dae-trace" }
hkdf = "0.12"
libc = "0.2"
md-5 = "0.10"
regex = "1"
rcgen = "0.13"
rustls = "0.23"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
url = "2"
