[package]
name = "dae-resident-dataplane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["test-boringssl-tcp-tls", "test-boringssl-quic"]
test-scalar-udp-recv = ["dae-datapath/test-scalar-udp-recv"]
test-scalar-udp-send = ["dae-datapath/test-scalar-udp-send"]
test-boringssl-tcp-tls = []
test-boringssl-tls-profile = ["test-boringssl-tcp-tls"]
test-boringssl-unbuffered-bio = ["test-boringssl-tcp-tls"]
test-boringssl-quic = ["dae-outbound/test-boringssl-quic"]
test-anytls-legacy-frame-reader = []
test-support = []

[dependencies]
dae-config.workspace = true
dae-runtime-control.workspace = true
dae-core-types.workspace = true
dae-datapath.workspace = true
dae-dns.workspace = true
dae-ebpf-support.workspace = true
dae-geodata.workspace = true
dae-netutil.workspace = true
dae-outbound.workspace = true
dae-routing.workspace = true
dae-sniffing.workspace = true
dae-tls.workspace = true
base64.workspace = true
blake2.workspace = true
boring.workspace = true
boring-sys.workspace = true
brotli.workspace = true
bytes.workspace = true
fastrand.workspace = true
flate2.workspace = true
foreign-types.workspace = true
futures-util.workspace = true
getrandom.workspace = true
h2.workspace = true
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
libc.workspace = true
quinn.workspace = true
quinn-boring.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
tls-parser.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-boring.workspace = true
udp.workspace = true
url.workspace = true

[dev-dependencies]
dae-datapath = { workspace = true, features = ["test-support"] }
dae-outbound = { workspace = true, features = ["test-support"] }
