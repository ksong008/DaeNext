[package]
name = "dae-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Default Rust-native daemon builds include the native Aya/eBPF loader and use
# the allocator selected by live RSS A/B.
default = [
    "product-api",
    "resident-runtime",
    "service-contract",
    "native-ebpf",
    "allocator-jemalloc",
]
product-api = [
    "resident-runtime",
    "service-contract",
    "dep:argon2",
    "dep:rusqlite",
    "dep:sha3",
]
resident-runtime = ["service-contract"]
service-contract = []
native-ebpf = ["dae-ebpf-loader/native-ebpf", "dae-ebpf-support/aya-loader"]
allocator-system = []
allocator-jemalloc = [
    "dep:tikv-jemallocator",
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemalloc-sys",
]
# Diagnostic-only compile switches used by the transparent-UDP four-quadrant
# A/B. Production builds leave both unset and use bounded syscall batching.
test-scalar-udp-recv = []
test-scalar-udp-send = []

[[bin]]
name = "daed"
path = "src/bin/daed.rs"
required-features = ["product-api"]

[[bin]]
name = "daed-contract-runner"
path = "src/bin/daed-contract-runner.rs"
required-features = ["service-contract"]

[dependencies]
dae-ebpf-loader.workspace = true
dae-config.workspace = true
dae-runtime-control.workspace = true
dae-core-types.workspace = true
dae-datapath.workspace = true
dae-dns.workspace = true
dae-ebpf-support.workspace = true
dae-engine.workspace = true
dae-geodata.workspace = true
dae-netutil.workspace = true
dae-outbound.workspace = true
dae-product-identity.workspace = true
dae-routing.workspace = true
dae-sniffing.workspace = true
argon2 = { workspace = true, optional = true }
boring.workspace = true
boring-sys.workspace = true
brotli.workspace = true
base64.workspace = true
blake2.workspace = true
bytes.workspace = true
fastrand.workspace = true
flate2.workspace = true
foreign-types.workspace = true
futures-util.workspace = true
getrandom.workspace = true
h2.workspace = true
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
libc.workspace = true
quinn.workspace = true
quinn-boring.workspace = true
udp.workspace = true
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
rustls.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3 = { workspace = true, optional = true }
socket2.workspace = true
tls-parser.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-boring.workspace = true
tokio-rustls.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
tikv-jemalloc-sys = { workspace = true, optional = true }
url.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
rcgen.workspace = true
