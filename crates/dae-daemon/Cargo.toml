[package]
name = "dae-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Default Rust-native daemon builds include the native Aya/eBPF loader and use
# the allocator selected by live RSS A/B.
default = [
    "product-api",
    "resident-runtime",
    "service-contract",
    "native-ebpf",
    "allocator-jemalloc",
    "test-boringssl-tcp-tls",
    "test-boringssl-quic",
]
product-api = [
    "resident-runtime",
    "service-contract",
    "dep:rusqlite",
]
resident-runtime = ["service-contract"]
service-contract = []
native-ebpf = ["dae-ebpf-loader/native-ebpf", "dae-ebpf-support/aya-loader"]
allocator-system = []
allocator-jemalloc = [
    "dep:tikv-jemallocator",
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemalloc-sys",
]
benchmark-support = ["dae-resident-dataplane/benchmark-support", "dae-product-control/benchmark-support"]
# Diagnostic-only compile switches used by the transparent-UDP four-quadrant
# A/B. Production builds leave both unset and use bounded syscall batching.
test-scalar-udp-recv = [
    "dae-datapath/test-scalar-udp-recv",
    "dae-resident-dataplane/test-scalar-udp-recv",
]
test-scalar-udp-send = [
    "dae-datapath/test-scalar-udp-send",
    "dae-resident-dataplane/test-scalar-udp-send",
]
# Build-only provider gate for the staged BoringSSL TCP TLS A/B. This is not a
# product schema or runtime fallback: a binary has exactly one admitted
# provider for each TLS shape.
test-boringssl-tcp-tls = ["dae-resident-dataplane/test-boringssl-tcp-tls"]
test-boringssl-tls-profile = [
    "test-boringssl-tcp-tls",
    "dae-resident-dataplane/test-boringssl-tls-profile",
]
test-boringssl-unbuffered-bio = [
    "test-boringssl-tcp-tls",
    "dae-resident-dataplane/test-boringssl-unbuffered-bio",
]
test-boringssl-quic = [
    "dae-outbound/test-boringssl-quic",
    "dae-resident-dataplane/test-boringssl-quic",
]
test-anytls-legacy-frame-reader = ["dae-resident-dataplane/test-anytls-legacy-frame-reader"]

[[bin]]
name = "daed"
path = "src/bin/daed.rs"
required-features = ["product-api"]

[[bin]]
name = "daed-contract-runner"
path = "src/bin/daed-contract-runner.rs"
required-features = ["service-contract"]

[dependencies]
dae-ebpf-loader.workspace = true
dae-config.workspace = true
dae-runtime-control.workspace = true
dae-core-types.workspace = true
dae-datapath.workspace = true
dae-dns.workspace = true
dae-ebpf-support.workspace = true
dae-geodata.workspace = true
dae-netutil.workspace = true
dae-outbound-core.workspace = true
dae-outbound-stream.workspace = true
dae-resident-dataplane.workspace = true
dae-product-control.workspace = true
dae-routing.workspace = true
dae-sniffing.workspace = true
dae-tls.workspace = true
boring.workspace = true
brotli.workspace = true
base64.workspace = true
bytes.workspace = true
fastrand.workspace = true
flate2.workspace = true
http.workspace = true
libc.workspace = true
udp.workspace = true
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-boring.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }
tikv-jemalloc-sys = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
dae-datapath = { workspace = true, features = ["test-support"] }
dae-outbound = { workspace = true, features = ["test-support"] }
dae-product-geodata = { workspace = true, features = ["test-support"] }
dae-product-control = { workspace = true, features = ["test-support"] }
dae-resident-dataplane = { workspace = true, features = ["test-support"] }
