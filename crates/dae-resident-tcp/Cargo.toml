[package]
name = "dae-resident-tcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
test-support = []
test-boringssl-tcp-tls = []
test-boringssl-tls-profile = ["dae-resident-transport/test-boringssl-tls-profile"]
test-boringssl-unbuffered-bio = ["dae-resident-transport/test-boringssl-unbuffered-bio"]
test-boringssl-quic = ["dae-outbound-quic/test-support"]

[dependencies]
dae-core-types.workspace = true
dae-datapath.workspace = true
dae-ebpf-support.workspace = true
dae-outbound-core.workspace = true
dae-outbound-quic.workspace = true
dae-outbound-stream.workspace = true
dae-resident-core.workspace = true
dae-resident-plan.workspace = true
dae-resident-transport.workspace = true
dae-runtime-control.workspace = true
dae-routing.workspace = true
dae-sniffing.workspace = true
dae-tls.workspace = true
bytes.workspace = true
fastrand.workspace = true
futures-util.workspace = true
h2.workspace = true
h3.workspace = true
http.workspace = true
quinn.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
url.workspace = true

[dev-dependencies]
dae-outbound = { workspace = true, features = ["test-support"] }
dae-resident-plan = { workspace = true, features = ["test-support"] }
dae-resident-transport = { workspace = true, features = ["test-support"] }
